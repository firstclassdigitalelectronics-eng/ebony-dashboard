<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ebonyfirstclass Enterprises Dashboard</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#1b1b2f;--mu:#6a6a85;--pr:#3b2f9e;--ac:#e0222d;--ok:#12805c;--bd:#dcdcec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12121c;--card:#1d1d2c;--tx:#ececf8;--mu:#a0a0bc;--pr:#8d82ff;--ac:#ff5a64;--ok:#3ecf9a;--bd:#33334a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12121c;--card:#1d1d2c;--tx:#ececf8;--mu:#a0a0bc;--pr:#8d82ff;--ac:#ff5a64;--ok:#3ecf9a;--bd:#33334a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--pr);color:#fff;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
header h1{font-size:17px;margin:0}header small{opacity:.85;font-size:11px;display:block}
select,input,button,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:100%}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{white-space:nowrap;cursor:pointer}nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{padding:0 12px 30px;max-width:1000px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.k{font-size:12px;color:var(--mu)}.v{font-size:20px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--ac)}
h2{font-size:16px;margin:4px 0 10px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.btn{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600;padding:10px;grid-column:1/-1}
.sm{cursor:pointer;padding:4px 9px;font-size:12px}.g{background:var(--ok);color:#fff;border:0}.r2{background:var(--ac);color:#fff;border:0}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mu)}.r{text-align:right}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--bd)}
.login{max-width:340px;margin:40px auto}.login form{grid-template-columns:1fr}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=i=>document.getElementById(i),n=x=>"₦"+Math.round(+x||0).toLocaleString(),td=()=>new Date().toISOString().slice(0,10);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const PROV=["DStv","GOtv","StarTimes","Free TV","Free-to-Air","Other"],SVC=["Decoder sale","Installation","Recharge / Subscription","Accessories","Other"],PAY=["Cash","Transfer","POS"],PT=["Monthly salary","Weekly pay","Commission","Daily wage"];
const mk=(a,s)=>a.map(x=>`<option${x===s?" selected":""}>${esc(x)}</option>`).join("");
let S={users:[{id:1,name:"Admin",role:"admin",pin:"1234",payType:"Monthly salary",payAmt:0,prof:{}}],cat:[
["DStv Recharge","DStv","Recharge / Subscription"],["GOtv Recharge","GOtv","Recharge / Subscription"],["StarTimes Recharge","StarTimes","Recharge / Subscription"],["DStv Installation","DStv","Installation"],["GOtv Installation","GOtv","Installation"],["StarTimes Installation","StarTimes","Installation"],["Free TV Decoder","Free TV","Decoder sale"],["Free-to-Air Decoder","Free-to-Air","Decoder sale"]].map((c,i)=>({id:i+1,name:c[0],prov:c[1],svc:c[2],price:0,cost:0})),
reqs:[],sales:[],pos:[],exp:[],reps:[],me:null,tab:"home"};
try{const d=localStorage.getItem("ebony_v2");if(d)S=Object.assign(S,JSON.parse(d));const m=localStorage.getItem("ebony_me");if(m)S.me=+m}catch(e){}
const COLS=["users","cat","reqs","sales","pos","exp","reps"];
const SB_URL="https://supabase.com/dashboard/project/cynchndzhhvilfrbvkdv/settings/api-keys",SB_KEY="sb_publishable_gPvZMfLP-w26j_DONRqA4w_4636zyp6";
let sb=null,SH={},ready=false,PEND=false,SES=null;
const save=()=>{try{localStorage.setItem("ebony_me",S.me||"")}catch(e){}
 if(!sb)return;
 COLS.forEach(c=>{const seen={};S[c].forEach(x=>{const k=String(x.id),j=JSON.stringify(x);seen[k]=1;if(SH[c][k]!==j){SH[c][k]=j;
  const w=c==="users"?sb.from(c).update({data:x}).eq("id",x.id).select().then(r=>r.error||r.data.length?r:sb.from(c).insert({id:x.id,data:x})):sb.from(c).upsert({id:x.id,data:x});
  w.then(r=>{if(r.error)alert("Not saved: "+r.error.message)})}});
  Object.keys(SH[c]).forEach(k=>{if(!seen[k]){delete SH[c][k];sb.from(c).delete().eq("id",k).then(r=>{if(r.error)alert("Not deleted: "+r.error.message)})}})})};
const rr=()=>{const a=document.activeElement;if(a&&a.form){PEND=true;return}R()};
document.addEventListener("focusout",()=>{if(PEND)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.form)){PEND=false;R()}},400)});
async function pull(){
 for(const c of COLS){const r=await sb.from(c).select("id,data");if(r.error){alert(r.error.message);continue}
  S[c]=r.data.map(x=>x.data).sort((x,y)=>(c==="users"||c==="cat")?x.id-y.id:y.id-x.id);SH[c]={};S[c].forEach(x=>SH[c][String(x.id)]=JSON.stringify(x))}
 const u=SES&&S.users.find(u=>(u.email||"").toLowerCase()===SES.user.email.toLowerCase());
 S.me=u?u.id:null;ready=true;rr()}
async function init(){
 if(!window.supabase||SB_URL.startsWith("PASTE")){ready=true;R();return}
 sb=supabase.createClient(SB_URL,SB_KEY);
 SES=(await sb.auth.getSession()).data.session;
 sb.auth.onAuthStateChange((e,s)=>{SES=s;if(s)pull();else{S.me=null;ready=true;R()}});
 if(SES)await pull();else{ready=true;R()}
 sb.channel("live").on("postgres_changes",{event:"*",schema:"public"},()=>{if(SES)pull()}).subscribe()}
const me=()=>S.users.find(u=>u.id===S.me),adm=()=>me().role==="admin",acc=()=>me().role!=="staff";
const mine=a=>acc()?a:a.filter(x=>x.staff===me().name);
const bars=o=>{const k=Object.keys(o);if(!k.length)return'<div class="k">No data yet</div>';const m=Math.max(...k.map(x=>o[x]))||1;return k.sort((a,b)=>o[b]-o[a]).map(x=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between"><span>${esc(x)}</span><b>${n(o[x])}</b></div><div style="height:8px;background:var(--bd);border-radius:5px"><div style="height:8px;width:${o[x]/m*100}%;background:var(--pr);border-radius:5px"></div></div></div>`).join("")};
const grp=(a,k,f)=>{const o={};a.forEach(x=>o[k(x)]=(o[k(x)]||0)+(+f(x)||0));return o};
const TABS={admin:[["home","Overview"],["sale","New Sale"],["pos","POS"],["rec","Records"],["reps","Daily Reports"],["price","Prices"],["acct","Accounts"],["staff","Staff & Pay"]],
accountant:[["home","Overview"],["rec","Records"],["reps","Daily Reports"],["price","Prices"],["acct","Accounts"]],
staff:[["home","Overview"],["sale","New Sale"],["pos","POS"],["rec","My Records"],["myrep","My Daily Report"],["price","Prices"],["prof","My Profile & Pay"]]};
const T={};
T.home=()=>{const t=td(),mo=t.slice(0,7),s=mine(S.sales),p=mine(S.pos),st=s.filter(x=>x.date===t),sm=s.filter(x=>x.date.slice(0,7)===mo);
 let h=`<div class="grid"><div class="card"><div class="k">Sales today</div><div class="v">${n(sum(st,x=>x.amount))}</div><div class="k">${st.length} records</div></div><div class="card"><div class="k">Sales this month</div><div class="v">${n(sum(sm,x=>x.amount))}</div></div><div class="card"><div class="k">POS fees today</div><div class="v">${n(sum(p.filter(x=>x.date===t),x=>x.fee))}</div></div>`;
 if(adm())h+=`<div class="card"><div class="k">Awaiting approval</div><div class="v bad">${S.reqs.filter(r=>r.st==="Pending").length} prices · ${S.reps.filter(r=>r.st==="Submitted").length} reports</div></div>`;
 return h+`</div><div class="card"><h2>This month by provider</h2>${bars(grp(sm,x=>x.prov,x=>x.amount))}</div>`};
T.sale=()=>`<div class="card"><h2>Record a sale / installation / recharge</h2><form id="sale"><label>Date<input type="date" name="date" value="${td()}" required></label><label>Item or service (fixed price)<select name="item" id="itm">${S.cat.map(c=>`<option value="${c.id}">${esc(c.name)} — ${n(c.price)}</option>`).join("")}</select></label><label>Quantity<input type="number" name="qty" value="1" min="1" required></label><label>Customer<input name="customer" required></label><label>Phone<input name="phone" type="tel"></label><label>Smartcard / IUC no.<input name="card"></label><label>Payment<select name="pay">${mk(PAY)}</select></label><label>Note<input name="note"></label><button class="btn">Save record</button></form><div class="k" style="margin-top:8px">Prices are set by Admin. To request a change, use the Prices tab.</div></div>`;
T.pos=()=>`<div class="card"><h2>POS transaction</h2><form id="pos"><label>Date<input type="date" name="date" value="${td()}" required></label><label>Type<select name="type">${mk(["Cash Withdrawal","Cash Deposit","Fund Transfer","Bill Payment","Airtime / Data"])}</select></label><label>Customer<input name="customer"></label><label>Amount (₦)<input type="number" name="amt" min="1" required></label><label>Fee charged (₦)<input type="number" name="fee" min="0" value="0"></label><label>Reference<input name="ref"></label><button class="btn">Save POS record</button></form></div>`+posTable();
const posTable=()=>{const p=mine(S.pos);return`<div class="card"><h2>POS records</h2><div class="k">Volume ${n(sum(p,x=>x.amt))} · Fees ${n(sum(p,x=>x.fee))}</div><div class="wrap"><table><tr><th>Date</th><th>Type</th><th>Customer</th><th>Staff</th><th class="r">Amount</th><th class="r">Fee</th>${acc()?"<th></th>":""}</tr>${p.map(x=>`<tr><td>${x.date}</td><td>${esc(x.type)}</td><td>${esc(x.customer)}<div class="k">${esc(x.ref)}</div></td><td>${esc(x.staff)}</td><td class="r">${n(x.amt)}</td><td class="r">${n(x.fee)}</td>${acc()?`<td><button class="sm r2" data-a="dpos" data-i="${x.id}">✕</button></td>`:""}</tr>`).join("")}</table></div></div>`};
T.rec=()=>{const s=mine(S.sales);return`<div class="card"><h2>Sales records</h2><div class="k">${s.length} records · ${n(sum(s,x=>x.amount))}</div><div class="wrap"><table><tr><th>Date</th><th>Customer</th><th>Item</th><th>Card no.</th><th>Staff</th><th>Pay</th><th class="r">Amount</th>${acc()?"<th></th>":""}</tr>${s.map(x=>`<tr><td>${x.date}</td><td>${esc(x.customer)}<div class="k">${esc(x.phone)}</div></td><td>${esc(x.name)} ×${x.qty}</td><td>${esc(x.card)}</td><td>${esc(x.staff)}</td><td><span class="tag">${esc(x.pay)}</span></td><td class="r">${n(x.amount)}</td>${acc()?`<td><button class="sm r2" data-a="dsale" data-i="${x.id}">✕</button></td>`:""}</tr>`).join("")}</table></div></div>`+posTable()};
const repCalc=(d,name)=>{const s=S.sales.filter(x=>x.date===d&&x.staff===name),p=S.pos.filter(x=>x.date===d&&x.staff===name);return{sales:sum(s,x=>x.amount),cash:sum(s.filter(x=>x.pay==="Cash"),x=>x.amount),ns:s.length,np:p.length,vol:sum(p,x=>x.amt),fee:sum(p,x=>x.fee)}};
T.myrep=()=>{const c=repCalc(td(),me().name);return`<div class="card"><h2>Daily report for ${td()}</h2><div class="grid"><div><div class="k">Sales (${c.ns})</div><b>${n(c.sales)}</b></div><div><div class="k">Cash sales</div><b>${n(c.cash)}</b></div><div><div class="k">POS (${c.np}) volume</div><b>${n(c.vol)}</b></div><div><div class="k">POS fees</div><b>${n(c.fee)}</b></div></div><form id="rep"><label>Date<input type="date" name="date" value="${td()}" required></label><label>Cash in hand (₦)<input type="number" name="cash" min="0" required></label><label style="grid-column:1/-1">Note to admin<input name="note"></label><button class="btn">Submit report to Admin</button></form></div>`+repList(S.reps.filter(r=>r.staff===me().name))};
const repList=a=>`<div class="card"><h2>Submitted reports</h2><div class="wrap"><table><tr><th>Date</th><th>Staff</th><th class="r">Sales</th><th class="r">POS fees</th><th class="r">Cash in hand</th><th>Note</th><th>Status</th></tr>${a.map(r=>`<tr><td>${r.date}</td><td>${esc(r.staff)}</td><td class="r">${n(r.sales)}</td><td class="r">${n(r.fee)}</td><td class="r">${n(r.cash)}</td><td>${esc(r.note)}</td><td>${r.st}${adm()&&r.st==="Submitted"?` <button class="sm g" data-a="rev" data-i="${r.id}">Mark reviewed</button>`:""}</td></tr>`).join("")}</table></div></div>`;
T.reps=()=>repList(S.reps);
T.price=()=>{let h=`<div class="card"><h2>Product and service prices</h2><div class="k">${adm()?"Only you (Admin) can change prices.":"Prices are locked. Request a change below; Admin must approve."}</div><div class="wrap"><table><tr><th>Item</th><th>Provider</th><th class="r">Price</th>${adm()?'<th class="r">Cost</th><th></th>':""}</tr>${S.cat.map(c=>`<tr><td>${esc(c.name)}<div class="k">${esc(c.svc)}</div></td><td>${esc(c.prov)}</td><td class="r">${n(c.price)}</td>${adm()?`<td class="r">${n(c.cost)}</td><td><button class="sm" data-a="eprice" data-i="${c.id}">Edit</button> <button class="sm r2" data-a="ditem" data-i="${c.id}">✕</button></td>`:""}</tr>`).join("")}</table></div></div>`;
 if(adm())h+=`<div class="card"><h2>Add item</h2><form id="item"><label>Name<input name="name" required></label><label>Provider<select name="prov">${mk(PROV)}</select></label><label>Service<select name="svc">${mk(SVC)}</select></label><label>Price (₦)<input type="number" name="price" min="0" required></label><label>Your cost (₦)<input type="number" name="cost" min="0" value="0"></label><button class="btn">Add item</button></form></div>`;
 else if(me().role==="staff")h+=`<div class="card"><h2>Request price change or new item</h2><form id="req"><label>Item name<input name="name" list="cl" required></label><datalist id="cl">${S.cat.map(c=>`<option>${esc(c.name)}`).join("")}</datalist><label>Proposed price (₦)<input type="number" name="price" min="0" required></label><label>Reason<input name="why"></label><button class="btn">Send to Admin</button></form></div>`;
 const rq=S.reqs.filter(r=>adm()||r.by===me().name);
 return h+`<div class="card"><h2>Price requests</h2><div class="wrap"><table><tr><th>Item</th><th>By</th><th class="r">Proposed</th><th>Reason</th><th>Status</th></tr>${rq.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.by)}</td><td class="r">${n(r.price)}</td><td>${esc(r.why)}</td><td>${r.st}${adm()&&r.st==="Pending"?` <button class="sm g" data-a="ok" data-i="${r.id}">Approve</button> <button class="sm r2" data-a="no" data-i="${r.id}">Reject</button>`:""}</td></tr>`).join("")}</table></div></div>`};
T.acct=()=>{const mo=td().slice(0,7),s=S.sales.filter(x=>x.date.slice(0,7)===mo),p=S.pos.filter(x=>x.date.slice(0,7)===mo),e=S.exp.filter(x=>x.date.slice(0,7)===mo);
 const rev=sum(s,x=>x.amount),cost=sum(s,x=>x.cost),fee=sum(p,x=>x.fee),ex=sum(e,x=>x.amount),net=rev-cost+fee-ex;
 return`<div class="grid"><div class="card"><div class="k">Sales revenue</div><div class="v">${n(rev)}</div></div><div class="card"><div class="k">Cost of goods</div><div class="v">${n(cost)}</div></div><div class="card"><div class="k">POS fees earned</div><div class="v">${n(fee)}</div></div><div class="card"><div class="k">Expenses & pay</div><div class="v bad">${n(ex)}</div></div><div class="card"><div class="k">Net profit (month)</div><div class="v ${net>=0?"ok":"bad"}">${n(net)}</div></div></div><div class="card"><h2>Sales by staff</h2>${bars(grp(s,x=>x.staff,x=>x.amount))}</div><div class="card"><h2>Add expense</h2><form id="exp"><label>Date<input type="date" name="date" value="${td()}" required></label><label>Category<select name="cat">${mk(["Rent","Transport","Stock purchase","Power / Data","Other"])}</select></label><label>Description<input name="desc"></label><label>Amount (₦)<input type="number" name="amt" min="0" required></label><button class="btn">Save expense</button></form></div><div class="card"><h2>Expense log</h2><div class="wrap"><table><tr><th>Date</th><th>Category</th><th>Description</th><th class="r">Amount</th><th></th></tr>${S.exp.map(x=>`<tr><td>${x.date}</td><td>${esc(x.cat)}</td><td>${esc(x.desc)}</td><td class="r">${n(x.amt)}</td><td><button class="sm r2" data-a="dexp" data-i="${x.id}">✕</button></td></tr>`).join("")}</table></div></div>`};
T.staff=()=>`<div class="card"><h2>Create staff / role</h2><form id="stf"><label>Name<input name="name" required></label><label>Role<select name="role"><option value="staff">Sales staff</option><option value="accountant">Accountant</option><option value="admin">Admin</option></select></label><label>Staff email (their login)<input name="email" type="email" required></label><label>Pay role<select name="payType">${mk(PT)}</select></label><label>Pay amount (₦)<input type="number" name="payAmt" min="0" value="0"></label><button class="btn">Create user</button></form></div><div class="card"><h2>Staff, pay and salary accounts</h2><div class="wrap"><table><tr><th>Name</th><th>Role</th><th>Pay</th><th>Salary account (set by staff)</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.name)}<div class="k">${esc(u.email)}</div></td><td>${u.role}</td><td>${esc(u.payType)}<br><b>${n(u.payAmt)}</b></td><td>${u.prof.bank?`${esc(u.prof.bank)} · ${esc(u.prof.acctNo)}<div class="k">${esc(u.prof.acctName)} · ${esc(u.prof.phone)}</div>`:'<span class="k">Not provided</span>'}</td><td><button class="sm" data-a="epay" data-i="${u.id}">Set pay</button> <button class="sm g" data-a="pay" data-i="${u.id}">Pay</button>${u.id!==S.me?` <button class="sm r2" data-a="du" data-i="${u.id}">✕</button>`:""}</td></tr>`).join("")}</table></div></div>`;
T.prof=()=>{const u=me(),p=u.prof;return`<div class="card"><h2>My pay role</h2><div class="k">Set by Admin</div><div class="v">${esc(u.payType)} · ${n(u.payAmt)}</div></div><div class="card"><h2>My profile and salary account</h2><form id="prof"><label>Full name<input name="full" value="${esc(p.full||u.name)}"></label><label>Phone<input name="phone" value="${esc(p.phone)}" type="tel"></label><label>Bank<input name="bank" value="${esc(p.bank)}"></label><label>Account number<input name="acctNo" value="${esc(p.acctNo)}"></label><label>Account name<input name="acctName" value="${esc(p.acctName)}"></label><button class="btn">Save profile</button></form></div>`};
const H={};
H.login=async d=>{if(!sb)return alert("Supabase keys not set yet");const r=await sb.auth.signInWithPassword({email:d.email,password:d.pw});if(r.error)alert(r.error.message)};
H.sale=d=>{const c=S.cat.find(x=>x.id==d.item),q=+d.qty||1;if(!c||c.price<=0)return alert("Price not set for this item. Ask Admin to set it.");S.sales.unshift({id:Date.now(),date:d.date,customer:d.customer,phone:d.phone,card:d.card,name:c.name,prov:c.prov,svc:c.svc,qty:q,amount:c.price*q,cost:c.cost*q,pay:d.pay,note:d.note,staff:me().name});save();S.tab="rec";R()};
H.pos=d=>{S.pos.unshift({id:Date.now(),date:d.date,type:d.type,customer:d.customer,amt:+d.amt,fee:+d.fee||0,ref:d.ref,staff:me().name});save();R()};
H.rep=d=>{const c=repCalc(d.date,me().name);S.reps=S.reps.filter(r=>!(r.date===d.date&&r.staff===me().name));S.reps.unshift({id:Date.now(),date:d.date,staff:me().name,sales:c.sales,fee:c.fee,cash:+d.cash,note:d.note,st:"Submitted"});save();R();alert("Report submitted to Admin")};
H.item=d=>{S.cat.push({id:Date.now(),name:d.name,prov:d.prov,svc:d.svc,price:+d.price,cost:+d.cost||0});save();R()};
H.req=d=>{S.reqs.unshift({id:Date.now(),name:d.name,price:+d.price,why:d.why,by:me().name,st:"Pending"});save();R()};
H.exp=d=>{S.exp.unshift({id:Date.now(),date:d.date,cat:d.cat,desc:d.desc,amt:+d.amt});save();R()};
H.stf=d=>{if(S.users.some(u=>u.name===d.name))return alert("Name already exists");S.users.push({id:Date.now(),name:d.name,role:d.role,email:d.email.toLowerCase(),payType:d.payType,payAmt:+d.payAmt||0,prof:{}});save();R()};
H.prof=d=>{const u=me();u.prof={full:d.full,phone:d.phone,bank:d.bank,acctNo:d.acctNo,acctName:d.acctName};if(d.pin)u.pin=d.pin;save();R();alert("Profile saved")};
const A={};
const U=i=>S.users.find(u=>u.id==i);
A.out=()=>{sb&&sb.auth.signOut()};
A.signup=async()=>{const f=document.getElementById("login"),email=f.email.value,pw=f.pw.value;if(!sb||!email||pw.length<6)return alert("Enter your email and a password of 6+ characters");const r=await sb.auth.signUp({email,password:pw});if(r.error)alert(r.error.message);else if(!r.data.session)alert("Account created. Check your email to confirm, then log in.")};

A.dpos=i=>{if(confirm("Delete?")){S.pos=S.pos.filter(x=>x.id!=i);save();R()}};
A.dexp=i=>{S.exp=S.exp.filter(x=>x.id!=i);save();R()};
A.rev=i=>{S.reps.find(r=>r.id==i).st="Reviewed";save();R()};
A.eprice=i=>{const c=S.cat.find(x=>x.id==i),p=prompt("New price for "+c.name,c.price);if(p!==null&&!isNaN(p)){c.price=+p;save();R()}};
A.ditem=i=>{if(confirm("Remove item?")){S.cat=S.cat.filter(x=>x.id!=i);save();R()}};
A.ok=i=>{const r=S.reqs.find(x=>x.id==i),c=S.cat.find(x=>x.name.toLowerCase()===r.name.toLowerCase());if(c)c.price=r.price;else S.cat.push({id:Date.now(),name:r.name,prov:"Other",svc:"Other",price:r.price,cost:0});r.st="Approved";save();R()};
A.no=i=>{S.reqs.find(x=>x.id==i).st="Rejected";save();R()};
A.epay=i=>{const u=U(i),a=prompt("Pay amount (₦) for "+u.name,u.payAmt);if(a===null||isNaN(a))return;u.payAmt=+a;const t=prompt("Pay role: "+PT.join(", "),u.payType);if(t)u.payType=t;save();R()};
A.pay=i=>{const u=U(i);if(u.payAmt>0&&confirm("Record payment of "+n(u.payAmt)+" to "+u.name+"?")){S.exp.unshift({id:Date.now(),date:td(),cat:"Salaries",desc:u.name+" ("+u.payType+")",amt:u.payAmt});save();R()}};
A.rpin=i=>{const p=prompt("New PIN for "+U(i).name);if(p&&p.length>=4){U(i).pin=p;save();R()}};
A.du=i=>{if(confirm("Remove this user?")){S.users=S.users.filter(u=>u.id!=i);save();R()}};
function R(){
 const a=$("app");if(!ready){a.innerHTML='<div class="card login"><h2>Connecting…</h2></div>';return}
 if(!S.me||!me()){a.innerHTML=`<header><div><h1>EBONYFIRSTCLASS ENTERPRISES</h1><small>DStv · GOtv · StarTimes · Free TV · POS</small></div></header><div class="card login"><h2>Log in</h2><form id="login"><label>Email<input name="email" type="email" required></label><label>Password<input name="pw" type="password" minlength="6" required></label><button class="btn">Log in</button></form><button class="sm" style="margin-top:8px" data-a="signup">First time? Create my account</button><div class="k" style="margin-top:8px">${!sb?"Supabase keys not set yet.":SES?"Signed in as "+esc(SES.user.email)+", but this email is not on the staff list. Ask Admin to add it.":"Use the email Admin added for you."}</div></div>`;return}
 const t=TABS[me().role]||TABS.staff;if(!t.some(x=>x[0]===S.tab))S.tab="home";
 a.innerHTML=`<header><div><h1>EBONYFIRSTCLASS ENTERPRISES</h1><small>${esc(me().name)} · ${me().role}${sb?" · shared data":" · offline, this phone only"}</small></div><button class="sm" data-a="out">Log out</button></header><nav>${t.map(x=>`<button class="${S.tab===x[0]?"on":""}" data-t="${x[0]}">${x[1]}</button>`).join("")}</nav><main>${T[S.tab]()}</main>`;
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-t]");if(t){S.tab=t.dataset.t;R();return}const b=e.target.closest("[data-a]");if(b)A[b.dataset.a](b.dataset.i)});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;if(H[f.id])H[f.id](Object.fromEntries(new FormData(f)))});
R();init();
</script></body></html>
